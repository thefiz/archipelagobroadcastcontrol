<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Overlay</title>
  <link rel="stylesheet" href="/styles.css">
  <style>html, body { background: transparent; overflow: hidden; }</style>
</head>
<body>
  <main class="overlay">
    <section id="box" class="overlay-box hidden">
      <div id="player" class="overlay-player"></div>
      <div id="game" class="overlay-game"></div>
      <div id="status" class="overlay-status"></div>
    </section>
  </main>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
