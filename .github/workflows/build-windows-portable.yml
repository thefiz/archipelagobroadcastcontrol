name: Build Windows Portable Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to package"
        required: true
        default: "v0.3.7"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          architecture: x64
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build portable Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $folderName = "ArchipelagoBroadcastControl-v$version-Windows-x64"
          $dist = Join-Path $PWD "dist"
          $stage = Join-Path $dist $folderName

          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "runtime") | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage "data") | Out-Null

          $files = @(
            "server.js",
            "package.json",
            "package-lock.json",
            "config.example.json",
            "README.md",
            "CHANGELOG.md"
          )

          foreach ($file in $files) {
            if (Test-Path $file) { Copy-Item $file -Destination $stage }
          }

          foreach ($dir in @("src", "public", "docs", "node_modules")) {
            if (Test-Path $dir) {
              Copy-Item $dir -Destination (Join-Path $stage $dir) -Recurse
            }
          }

          $nodeExe = (Get-Command node.exe).Source
          Copy-Item $nodeExe -Destination (Join-Path $stage "runtime\node.exe")

          $nodeDir = Split-Path $nodeExe -Parent
          $nodeLicense = Join-Path $nodeDir "LICENSE"
          if (Test-Path $nodeLicense) {
            Copy-Item $nodeLicense -Destination (Join-Path $stage "runtime\NODE-LICENSE.txt")
          }

          @'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "%~dp0start-event.ps1"
          if errorlevel 1 pause
          '@ | Set-Content -Path (Join-Path $stage "start-event.cmd") -Encoding ASCII

          @'
          $ErrorActionPreference = "Stop"
          $root = Split-Path -Parent $MyInvocation.MyCommand.Path
          Set-Location $root

          $node = Join-Path $root "runtime\node.exe"
          $server = Join-Path $root "server.js"
          $config = Join-Path $root "config.json"
          $configExample = Join-Path $root "config.example.json"

          if (-not (Test-Path $node)) {
            Write-Host "ERROR: Bundled Node.js runtime is missing." -ForegroundColor Red
            exit 1
          }

          if (-not (Test-Path $config)) {
            Copy-Item $configExample $config
            Write-Host ""
            Write-Host "FIRST-RUN SETUP" -ForegroundColor Yellow
            Write-Host "A config.json file has been created from config.example.json."
            Write-Host "Edit the player roster, game assignments, and tokens before starting the server."
            Write-Host ""
            Start-Process notepad.exe -ArgumentList "`"$config`"" -Wait
            Write-Host "Configuration editor closed. Re-run start-event.cmd when the file is ready."
            Read-Host "Press Enter to exit"
            exit 2
          }

          Write-Host "Archipelago Broadcast Control" -ForegroundColor Cyan
          Write-Host "Portable Windows Release" -ForegroundColor DarkGray
          Write-Host ""

          $secureKey = Read-Host "Enter production admin key" -AsSecureString
          $bstr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($secureKey)
          try {
            $plainKey = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($bstr)
          }
          finally {
            [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($bstr)
          }

          if ([string]::IsNullOrWhiteSpace($plainKey)) {
            Write-Host "ERROR: Admin key cannot be empty." -ForegroundColor Red
            exit 1
          }

          $env:ADMIN_KEY = $plainKey
          Remove-Variable plainKey

          Write-Host ""
          Write-Host "Dashboard:" -ForegroundColor Green
          Write-Host "  http://localhost:3000/dashboard.html"
          Write-Host ""
          Write-Host "Network addresses:" -ForegroundColor Green

          try {
            $addresses = Get-NetIPAddress -AddressFamily IPv4 -AddressState Preferred -ErrorAction Stop |
              Where-Object {
                $_.IPAddress -notmatch '^127\.' -and
                $_.IPAddress -notmatch '^169\.254\.'
              } |
              Select-Object -ExpandProperty IPAddress -Unique

            foreach ($address in $addresses) {
              Write-Host "  http://$address`:3000/"
            }
          }
          catch {
            Write-Host "  Unable to automatically determine LAN IP. Run ipconfig in another window."
          }

          Write-Host ""
          Write-Host "If Windows Firewall prompts for node.exe, allow it on the production/private network." -ForegroundColor Yellow
          Write-Host "Press Ctrl+C to stop the server." -ForegroundColor DarkGray
          Write-Host ""

          $dashboard = "http://localhost:3000/dashboard.html"
          $browserJob = Start-Job -ScriptBlock {
            param($url)
            Start-Sleep -Seconds 2
            Start-Process $url
          } -ArgumentList $dashboard

          try {
            & $node $server
            $exitCode = $LASTEXITCODE
          }
          finally {
            $env:ADMIN_KEY = $null
            if ($browserJob) {
              Stop-Job $browserJob -ErrorAction SilentlyContinue
              Remove-Job $browserJob -Force -ErrorAction SilentlyContinue
            }
          }

          Write-Host ""
          Write-Host "Server stopped with exit code $exitCode." -ForegroundColor Yellow
          Read-Host "Press Enter to close"
          exit $exitCode
          '@ | Set-Content -Path (Join-Path $stage "start-event.ps1") -Encoding UTF8

          @'
          ARCHIPELAGO BROADCAST CONTROL - PORTABLE WINDOWS RELEASE
          ========================================================

          No installation of Node.js, npm, or Git is required on the event computer.

          FIRST RUN
          ---------
          1. Extract the entire ZIP to a normal writable folder.
          2. Double-click start-event.cmd.
          3. If config.json does not exist, the launcher creates it and opens Notepad.
          4. Configure the real players, games, and player tokens, save, and close Notepad.
          5. Double-click start-event.cmd again.
          6. Enter the production admin key when prompted.
          7. The local production dashboard opens automatically.

          IMPORTANT
          ---------
          - Keep the entire folder together; runtime\node.exe is required.
          - Do not put the real config.json into a public repository.
          - Windows Firewall may prompt the first time the bundled node.exe listens on port 3000.
            Allow access on the production/private network.
          - Give the server a stable IP address or DHCP reservation for event use.
          - Stop the server with Ctrl+C in the server window.

          The package intentionally contains no saved event state. data\state.json will be
          created as the application runs.
          '@ | Set-Content -Path (Join-Path $stage "PORTABLE-WINDOWS.txt") -Encoding ASCII

          $zip = Join-Path $dist "$folderName.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal

          $hash = Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($zip))" |
            Set-Content -Path "$zip.sha256.txt" -Encoding ASCII

          Write-Host "Built: $zip"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ArchipelagoBroadcastControl-Windows-x64-${{ inputs.ref }}
          path: |
            dist/*.zip
            dist/*.sha256.txt
          if-no-files-found: error
          retention-days: 30
